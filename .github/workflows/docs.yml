name: Build and Deploy Docs to gh-pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # scripts/dev.sh makes .venv with uv and installs the package there
      - name: Install uv
        run: pip install uv

      - name: Build HTML docs (using script)
        run: |
          ./scripts/docs.sh

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build/html
          publish_branch: gh-pages
          commit_message: "Deploy docs from ${{ github.sha }}"
          force_orphan: true
