name: MacOS

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-15, macos-15-intel ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://pandecode.github.io/FMM3D/simple/ --extra-index-url https://pypi.org/simple -e . pytest

      - name: Tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: pytest -q

      - name: Offscreen render
        run: python scripts/render_check.py render-${{ matrix.os }}.png

      # the 3D view is known not to open on MacOS, this step shows whether it
      # does without failing the job
      - name: Gui with the 3D view
        # continue-on-error: true
        # MacOS needs PySide6 < 6.10 for the 3D view, this catches it breaking again
        env:
          BEMFMM_READY_FILE: ${{ runner.temp }}/gui-ready
        run: |
          python -m bemfmm gui &
          pid=$!
          for _ in $(seq 60); do
            if [ -e "$BEMFMM_READY_FILE" ] || ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          sleep 2
          screencapture -x gui-${{ matrix.os }}.png
          kill "$pid" 2>/dev/null || true
          test -e "$BEMFMM_READY_FILE"

      - name: Gui without the 3D view
        run: |
          python -m bemfmm gui --no-3d &
          pid=$!
          sleep 15
          kill -0 "$pid"
          kill "$pid"

      - name: Upload images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ matrix.os }}
          path: "*.png"
          if-no-files-found: ignore
