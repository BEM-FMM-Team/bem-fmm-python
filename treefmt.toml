# treefmt formats the repo, the formatters come with the dev shell

[formatter.isort]
command = "isort"
includes = ["*.py"]
# generated by pyside6-uic, only black formats them
excludes = ["src/bemfmm/gui/ui_*.py"]
priority = 1

[formatter.black]
command = "black"
includes = ["*.py"]
priority = 2

[formatter.nixfmt]
command = "nixfmt"
includes = ["*.nix"]
